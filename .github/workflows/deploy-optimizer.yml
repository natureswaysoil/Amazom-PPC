name: Deploy PPC Optimizer to Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'optimizer_core.py'
      - 'dashboard_client.py'
      - 'bigquery_client.py'
      - 'gcp_credentials.py'
      - 'requirements.txt'
      - 'config.json'
      - '.github/workflows/deploy-optimizer.yml'
  workflow_dispatch:
    inputs:
      region:
        description: 'GCP Region'
        required: false
        default: 'us-central1'
      dry_run:
        description: 'Dry run (validate only)'
        required: false
        default: 'false'

env:
  FUNCTION_NAME: amazon-ppc-optimizer
  REGION: us-central1
  RUNTIME: python311
  ENTRY_POINT: optimizePPC

jobs:
  deploy:
    name: Deploy to Cloud Functions
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Verify required files
        run: |
          echo "Checking required files..."
          for file in main.py optimizer_core.py dashboard_client.py requirements.txt; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: $file not found"
              exit 1
            fi
            echo "✓ $file"
          done
      
      - name: Verify entry points
        run: |
          echo "Verifying Cloud Function entry points..."
          python3 verify_entry_points.py
          echo "✓ Entry point verification passed"
      
      - name: Verify secrets exist
        run: |
          echo "Verifying secrets in Secret Manager..."
          REQUIRED_SECRETS=(
            "AMAZON_CLIENT_ID"
            "AMAZON_CLIENT_SECRET"
            "AMAZON_REFRESH_TOKEN"
            "DASHBOARD_API_KEY"
          )
          
          MISSING=0
          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            if gcloud secrets describe "$SECRET" --project="${{ secrets.GCP_PROJECT_ID }}" &>/dev/null; then
              echo "✓ $SECRET"
            else
              echo "❌ $SECRET (missing)"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "ERROR: One or more required secrets are missing"
            echo "Create them in Google Secret Manager before deploying"
            exit 1
          fi
          
          echo ""
          echo "✓ All required secrets verified"
      
      - name: Deploy to Cloud Functions
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          REGION="${{ github.event.inputs.region || env.REGION }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          
          # Build secret references
          SECRETS="AMAZON_CLIENT_ID=projects/$PROJECT_ID/secrets/AMAZON_CLIENT_ID:latest"
          SECRETS="$SECRETS,AMAZON_CLIENT_SECRET=projects/$PROJECT_ID/secrets/AMAZON_CLIENT_SECRET:latest"
          SECRETS="$SECRETS,AMAZON_REFRESH_TOKEN=projects/$PROJECT_ID/secrets/AMAZON_REFRESH_TOKEN:latest"
          SECRETS="$SECRETS,DASHBOARD_API_KEY=projects/$PROJECT_ID/secrets/DASHBOARD_API_KEY:latest"
          
          # Optional profile ID secret
          if gcloud secrets describe "AMAZON_PROFILE_ID" --project="$PROJECT_ID" &>/dev/null; then
            echo "✓ Including AMAZON_PROFILE_ID secret"
            SECRETS="$SECRETS,AMAZON_PROFILE_ID=projects/$PROJECT_ID/secrets/AMAZON_PROFILE_ID:latest"
          fi
          
          echo "Deploying Cloud Function to $REGION..."
          
          gcloud functions deploy "$FUNCTION_NAME" \
            --gen2 \
            --region="$REGION" \
            --runtime="$RUNTIME" \
            --source=. \
            --entry-point="$ENTRY_POINT" \
            --trigger-http \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=540s \
            --memory=1024MB \
            --set-env-vars="LOG_LEVEL=INFO,MIN_RUN_INTERVAL_MINUTES=120" \
            --set-secrets="$SECRETS" \
            --ingress-settings=all \
            --project="$PROJECT_ID"
      
      - name: Get function URL
        if: success()
        id: get-url
        run: |
          FUNCTION_URL=$(gcloud functions describe "$FUNCTION_NAME" \
            --region="${{ github.event.inputs.region || env.REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --gen2 \
            --format='value(serviceConfig.uri)')
          
          echo "url=$FUNCTION_URL" >> $GITHUB_OUTPUT
          echo "Function URL: $FUNCTION_URL"
      
      - name: Test health endpoint
        if: success()
        run: |
          echo "Testing health endpoint..."
          RESPONSE=$(curl -s "${{ steps.get-url.outputs.url }}?health=true")
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
            echo "✅ Health check passed"
          else
            echo "⚠️  Health check returned unexpected response"
          fi
      
      - name: Deployment summary
        if: success()
        run: |
          echo "=================================================="
          echo "✅ Deployment Successful"
          echo "=================================================="
          echo ""
          echo "Function Name: $FUNCTION_NAME"
          echo "Region: ${{ github.event.inputs.region || env.REGION }}"
          echo "URL: ${{ steps.get-url.outputs.url }}"
          echo ""
          echo "Test commands:"
          echo "  curl \"${{ steps.get-url.outputs.url }}?health=true\""
          echo "  curl \"${{ steps.get-url.outputs.url }}?verify_connection=true\""
          echo ""
          echo "=================================================="
      
      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=================================================="
          echo "✅ Dry Run Complete - No deployment performed"
          echo "=================================================="
          echo ""
          echo "All validation checks passed"
          echo "Remove dry_run input to perform actual deployment"
          echo ""
